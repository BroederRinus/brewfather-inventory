<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Debug</title></head>
<body style="background:#111;color:#eee;font-family:monospace;padding:20px">
<h2>Brewfather API Debug</h2>
<input id="u" placeholder="User ID" style="background:#222;color:#eee;border:1px solid #444;padding:6px;width:200px;margin-right:8px">
<input id="k" placeholder="API Key" type="password" style="background:#222;color:#eee;border:1px solid #444;padding:6px;width:200px;margin-right:8px">
<br><br>
<input id="search" placeholder="filter by name (e.g. pale)" style="background:#222;color:#eee;border:1px solid #444;padding:6px;width:200px;margin-right:8px">
<button onclick="run('fermentables')" style="background:#e8a13a;border:none;padding:6px 14px;cursor:pointer;font-weight:bold;margin:4px">Fermentables</button>
<button onclick="run('hops')" style="background:#e8a13a;border:none;padding:6px 14px;cursor:pointer;font-weight:bold;margin:4px">Hops</button>
<button onclick="run('yeasts')" style="background:#e8a13a;border:none;padding:6px 14px;cursor:pointer;font-weight:bold;margin:4px">Yeasts</button>
<pre id="out" style="margin-top:20px;white-space:pre-wrap;font-size:12px"></pre>
<script>
async function run(cat) {
  var u = document.getElementById('u').value.trim();
  var k = document.getElementById('k').value.trim();
  var search = document.getElementById('search').value.trim();
  var out = document.getElementById('out');
  out.textContent = 'Loading...';
  try {
    var url = '/api/inventory/' + cat + '?limit=50&complete=true';
    var r = await fetch(url, { headers: { 'x-bf-userid': u, 'x-bf-apikey': k } });
    var data = await r.json();
    if (search) {
      data = data.filter(function(i) { return (i.name||'').toLowerCase().includes(search.toLowerCase()) || (i.supplier||'').toLowerCase().includes(search.toLowerCase()); });
    }
    // Show only the most relevant fields
    var slim = data.map(function(i) { return { _id: i._id, name: i.name, supplier: i.supplier, origin: i.origin, productId: i.productId, inventory: i.inventory }; });
    out.textContent = JSON.stringify(slim, null, 2);
  } catch(e) {
    out.textContent = 'Error: ' + e.message;
  }
}
</script>
</body>
</html>
