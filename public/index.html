<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Brewfather Inventory</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a;
  --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.18);
  --text: #f0f0f5; --muted: #7a7d99; --accent: #e8a13a;
  --danger: #e05050; --success: #4aaa70; --warn: #e0a030;
  --hop-bg: #1a2e1d; --hop: #3a7d44;
  --malt-bg: #2e2010; --malt: #8a5a2a;
  --yeast-bg: #1a1530; --yeast: #4a3a8a;
  --misc-bg: #102030; --misc: #3a6a7a;
  --font: 'DM Sans', sans-serif; --mono: 'DM Mono', monospace;
  --radius: 12px; --radius-sm: 8px;
}
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; }
.app { width: 100%; max-width: 520px; min-height: 100vh; display: flex; flex-direction: column; }

/* Topbar */
.topbar { display: flex; align-items: center; gap: 10px; padding: 1.25rem 1.25rem 0; margin-bottom: 1.25rem; }
.topbar-icon { width: 30px; height: 30px; background: var(--accent); border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
.topbar h1 { font-family: var(--mono); font-size: 14px; font-weight: 500; color: var(--text); }
.back-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; padding: 0 4px 0 0; line-height: 1; flex-shrink: 0; }
.back-btn:hover { color: var(--text); }

/* Screens */
.screen { display: none; padding: 0 1.25rem 2rem; flex: 1; flex-direction: column; }
.screen.active { display: flex; }

/* Typography */
.section-label { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.6rem; }
.sub-text { font-size: 14px; color: var(--muted); margin-bottom: 1.1rem; line-height: 1.6; }

/* Fields */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 1rem; }
.field label { font-size: 13px; color: var(--muted); font-family: var(--mono); }
.field input { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-family: var(--mono); font-size: 14px; padding: 10px 12px; outline: none; transition: border-color 0.15s; width: 100%; }
.field input:focus { border-color: var(--accent); }
.hint { font-size: 12px; color: var(--muted); line-height: 1.5; }

/* Buttons */
.btn { width: 100%; padding: 13px; border-radius: var(--radius-sm); border: 1px solid var(--border2); background: var(--surface); color: var(--text); font-family: var(--font); font-size: 15px; font-weight: 500; cursor: pointer; transition: background 0.15s; margin-top: 0.5rem; }
.btn:hover { background: var(--surface2); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-accent { background: var(--accent); border-color: var(--accent); color: #0f1117; }
.btn-accent:hover { background: #f0b050; border-color: #f0b050; }
.btn-danger { border-color: rgba(224,80,80,0.4); color: var(--danger); }
.btn-danger:hover:not(:disabled) { background: rgba(224,80,80,0.1); }
.btn-success { border-color: rgba(74,170,112,0.4); color: var(--success); }
.btn-success:hover:not(:disabled) { background: rgba(74,170,112,0.1); }
.btn-small { font-size: 13px; padding: 9px; margin-top: 0.75rem; color: var(--muted); border-color: var(--border); }
.btn-row { display: flex; gap: 8px; margin-top: 0.5rem; }
.btn-row .btn { margin-top: 0; }

/* Recipe cards */
.recipe-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 0.9rem 1.1rem;
  margin-bottom: 8px; cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  display: flex; align-items: center; gap: 12px; user-select: none;
}
.recipe-card:hover { border-color: var(--border2); background: var(--surface2); }
.recipe-card.selected { border-color: var(--accent); background: rgba(232,161,58,0.06); }
.recipe-card-check {
  width: 20px; height: 20px; border-radius: 5px; border: 1px solid var(--border2);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  font-size: 12px; transition: background 0.15s, border-color 0.15s;
}
.recipe-card.selected .recipe-card-check { background: var(--accent); border-color: var(--accent); color: #0f1117; }
.recipe-card-info { flex: 1; min-width: 0; }
.recipe-card-info h2 { font-size: 15px; font-weight: 500; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recipe-card-info p { font-size: 12px; color: var(--muted); }

/* Selection bar */
.selection-bar {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 0.75rem 0 0; margin-top: auto;
  border-top: 1px solid var(--border);
}
.selection-count { font-size: 13px; color: var(--muted); margin-bottom: 6px; font-family: var(--mono); }

/* Ingredient rows */
.ing-list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 1rem; }
.ing-row { display: flex; align-items: center; gap: 8px; padding: 10px 1rem; border-bottom: 1px solid var(--border); }
.ing-row:last-child { border-bottom: none; }
.ing-name { flex: 1; font-size: 13px; min-width: 0; }
.ing-name small { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; font-family: var(--mono); }
.ing-badge { font-size: 10px; font-family: var(--mono); padding: 2px 5px; border-radius: 4px; font-weight: 500; white-space: nowrap; flex-shrink: 0; }
.badge-hop { background: var(--hop-bg); color: #6dcc80; border: 1px solid var(--hop); }
.badge-malt { background: var(--malt-bg); color: #e0a060; border: 1px solid var(--malt); }
.badge-yeast { background: var(--yeast-bg); color: #a080e0; border: 1px solid var(--yeast); }
.badge-misc { background: var(--misc-bg); color: #60b0cc; border: 1px solid var(--misc); }
.ing-status { font-size: 12px; font-family: var(--mono); white-space: nowrap; flex-shrink: 0; }
.ing-status.ok { color: var(--success); }
.ing-status.low { color: var(--warn); }
.ing-status.missing { color: var(--danger); }
.ing-input { width: 62px; padding: 4px 7px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: var(--mono); font-size: 13px; text-align: right; outline: none; }
.ing-input:focus { border-color: var(--accent); }
.ing-unit { font-size: 11px; color: var(--muted); font-family: var(--mono); min-width: 18px; flex-shrink: 0; }

/* Recipe columns for side-by-side check */
.recipe-columns { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 1rem; }
.recipe-column { flex: 0 0 260px; }
.recipe-column-header { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius) var(--radius) 0 0; padding: 10px 12px; border-bottom: none; }
.recipe-column-header h3 { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recipe-column-header p { font-size: 11px; color: var(--muted); margin-top: 2px; }
.recipe-column .ing-list { border-radius: 0 0 var(--radius) var(--radius); margin-bottom: 0; }
.recipe-column .ing-row { padding: 8px 10px; }

/* Summary pills */
.summary-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; }
.pill { font-size: 12px; font-family: var(--mono); padding: 4px 10px; border-radius: 20px; }
.pill-ok { background: rgba(74,170,112,0.12); color: var(--success); border: 1px solid rgba(74,170,112,0.3); }
.pill-warn { background: rgba(224,160,48,0.12); color: var(--warn); border: 1px solid rgba(224,160,48,0.3); }
.pill-danger { background: rgba(224,80,80,0.12); color: var(--danger); border: 1px solid rgba(224,80,80,0.3); }
